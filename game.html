<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="含50个行动关卡的明日方舟风格塔防试玩。"><title>塔防作战｜罗德岛终端</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="game.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html">RHODES<i>•</i>ISLAND</a><nav class="navlinks"><a href="index.html">首页</a><a href="characters.html">干员档案</a><a class="active" href="game.html">塔防试玩</a></nav></div></header><main><section class="wrap td-shell"><div class="td-top"><div><div class="eyebrow">TACTICAL SIMULATION · 50 OPERATIONS</div><h1 class="section-title">罗德岛战术演习</h1><p class="lead">选择行动、选择干员，再点击符合职业的平台部署。敌军将分波进攻；积累部署费用、把握技能时机并守住终点。</p></div><select class="level-select" id="level" aria-label="选择行动"></select></div><div class="td-layout"><div><div class="td-board"><canvas id="board" aria-label="战场网格"></canvas><div class="td-hud"><div class="td-pill">生命 <b id="life">3</b></div><div class="td-pill">费用 <b id="dp">22</b></div><div class="td-pill">歼灭 <b id="kills">0/0</b></div></div></div><div class="td-controls"><button class="button" id="start">开始行动</button><button class="button alt" id="reset">重置行动</button></div></div><aside class="td-side"><h3>作战波次</h3><div class="wave-track" id="waves"></div><h3>选择干员</h3><div id="operators"></div><div class="td-skills"><h3>已部署干员技能</h3><div id="skills"><small>部署干员后可在这里释放技能。</small></div></div><p class="td-log" id="log">请选择行动和一名干员，点击开始行动。</p></aside></div></section></main><footer><div class="wrap footer">非官方的浏览器战术演习。人物、立绘和相关设定权利归其权利人所有。</div></footer><script type="module">import{OPERATORS,LEVELS,GRID}from'./js/game-data.js';import{GameEngine}from'./js/game-engine.js';import{render}from'./js/game-render.js';const $=s=>document.querySelector(s),canvas=$('#board'),level=$('#level'),ops=$('#operators'),skills=$('#skills'),log=$('#log');let g=new GameEngine(),last=0,geom;LEVELS.forEach(x=>level.add(new Option(`${x.name} · ${x.waves.length} 波`,x.id)));function ui(){ $('#life').textContent=g.life;$('#dp').textContent=Math.floor(g.dp);$('#kills').textContent=`${g.kills}/${g.total}`;$('#waves').innerHTML=g.level.waves.map((_,i)=>`<i class="wave-dot ${i<g.wave?'done':i===g.wave?'now':''}"></i>`).join('');ops.innerHTML=OPERATORS.map(o=>`<button class="td-op ${g.selected?.id===o.id?'active':''}" data-id="${o.id}"><img src="${o.portrait}" alt=""><span><strong>${o.name}</strong><br><small>${o.role} · ${o.skill}</small></span><em>${o.cost}</em></button>`).join('');skills.innerHTML=g.units.length?g.units.map((u,i)=>`<button class="td-skill" data-skill="${i}" ${u.skillCd>0?'disabled':''}>${u.name} · ${u.skill} ${u.skillCd>0?`(${Math.ceil(u.skillCd)}s)`:''}</button>`).join(''):'<small>部署干员后可在这里释放技能。</small>'}function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;g.tick(dt);geom=render(canvas,g);ui();requestAnimationFrame(loop)}g.on('log',x=>log.textContent=x);g.on('end',ok=>{log.textContent=ok?'行动成功！可选择下一关继续演习。':'行动失败：终端失守。请调整部署后重试。'});g.on('state',()=>{});ops.onclick=e=>{let b=e.target.closest('[data-id]');if(b)g.select(b.dataset.id)};skills.onclick=e=>{let b=e.target.closest('[data-skill]');if(b)g.skill(+b.dataset.skill)};canvas.onclick=e=>{if(!geom)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left),y=(e.clientY-r.top),col=Math.floor((x-geom.ox)/geom.s),row=Math.floor((y-geom.oy)/geom.s);if(col>=0&&col<GRID.cols&&row>=0&&row<GRID.rows)g.deploy(col,row)};$('#start').onclick=()=>g.start();$('#reset').onclick=()=>{g.reset(+level.value);log.textContent='行动已重置。请选择干员并开始。'};level.onchange=()=>{g.reset(+level.value);log.textContent='已切换行动。'};level.value=1;g.select('amiya');ui();requestAnimationFrame(loop);</script></body></html>
