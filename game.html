<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="明日方舟风格塔防小游戏。"><title>塔防试玩｜罗德岛终端</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html">RHODES<i>•</i>ISLAND</a><nav class="navlinks"><a href="index.html">首页</a><a href="characters.html">干员档案</a><a class="active" href="game.html">塔防试玩</a></nav></div></header><main><section class="wrap"><div class="eyebrow">OPERATION SIMULATION · 01</div><h1 class="section-title">简易塔防作战</h1><p class="lead">使用部署费用放置近卫。近卫会自动攻击进入其攻击范围的敌人；敌人抵达终点会扣除生命。守住 3 点生命直到第 15 名敌人被消灭。</p><div class="game-layout"><div class="battlefield" id="field"><div class="path"></div><div class="base">罗德岛终端<br>生命：<span id="basehp">3</span></div></div><aside class="sidebar"><div class="hud"><div>部署费用<br><strong id="cost">12</strong></div><div>敌军<br><strong id="count">0 / 15</strong></div></div><button class="deploy" id="deploy">部署近卫 · 消耗 6 费用<br><small>可部署于中央防线，攻击范围 140px</small></button><button class="deploy" id="start">开始行动</button><p class="log" id="log">等待博士下达行动指令。</p></aside></div></section></main><footer><div class="wrap footer">这是非官方、简化的网页小游戏，不代表游戏真实机制。</div></footer><script>const field=document.querySelector('#field'),costEl=document.querySelector('#cost'),countEl=document.querySelector('#count'),hpEl=document.querySelector('#basehp'),log=document.querySelector('#log'),deploy=document.querySelector('#deploy'),start=document.querySelector('#start');let cost=12,hp=3,kills=0,spawned=0,unit=null,running=false,timer=null;function upd(){costEl.textContent=cost;countEl.textContent=`${kills} / 15`;hpEl.textContent=hp;deploy.disabled=!!unit||cost<6||!running}function say(t){log.textContent=t}deploy.onclick=()=>{if(unit||cost<6)return;cost-=6;unit=document.createElement('div');unit.className='unit';unit.style.left='45%';unit.style.top='24%';unit.textContent='近';field.append(unit);say('近卫已部署：正在监测攻击范围。');upd()};function enemy(){if(!running||spawned>=15)return;spawned++;const e=document.createElement('div');e.className='enemy';field.append(e);let x=-38,life=5;const move=setInterval(()=>{if(!running){clearInterval(move);e.remove();return}x+=1.25;e.style.left=x+'px';if(unit&&x>field.clientWidth*.45-140&&x<field.clientWidth*.45+95){life-=.09;e.style.filter='brightness(1.5)';setTimeout(()=>e.style.filter='',70)}if(life<=0){clearInterval(move);e.remove();kills++;say(`敌军已击破。当前战果 ${kills}/15`);if(kills===15){running=false;clearInterval(timer);say('行动成功！罗德岛终端安全。');start.textContent='任务完成';start.disabled=true}upd()}else if(x>field.clientWidth-95){clearInterval(move);e.remove();hp--;say('敌军突破防线！');if(hp<=0){running=false;clearInterval(timer);say('行动失败：终端已失守。点击刷新页面重试。');start.disabled=true}upd()}},20)}start.onclick=()=>{if(running)return;running=true;start.disabled=true;start.textContent='行动进行中';say('敌军正在接近，尽快部署近卫！');upd();timer=setInterval(()=>{enemy();if(spawned>=15)clearInterval(timer)},1200)};setInterval(()=>{if(running&&cost<18){cost++;upd()}},1800);upd()</script></body></html>
