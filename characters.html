<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="明日方舟全量干员图鉴。"><title>全量干员档案｜罗德岛终端</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html">RHODES<i>•</i>ISLAND</a><nav class="navlinks"><a href="index.html">首页</a><a class="active" href="characters.html">干员档案</a><a href="game.html">塔防试玩</a></nav></div></header><main><section class="wrap"><div class="eyebrow">OPERATOR DATABASE · COMPLETE ARCHIVE</div><h1 class="section-title">全量干员档案</h1><p class="lead">收录当前资料表中可部署职业的全部干员。可用职业和名称检索快速定位；图鉴优先显示已收录的本地立绘，其余干员以档案卡方式呈现，避免因第三方图源失效而出现空白卡。</p><div class="catalogue-status"><strong id="total">正在载入档案…</strong><span id="shown"></span></div><div class="catalogue-tools"><label class="searchbox">⌕ <input id="search" type="search" placeholder="搜索干员名称，例如：阿米娅" autocomplete="off"></label><div class="filterbar" id="filters"><button class="filter active" data-role="all">全部</button><button class="filter" data-role="先锋">先锋</button><button class="filter" data-role="近卫">近卫</button><button class="filter" data-role="狙击">狙击</button><button class="filter" data-role="术师">术师</button><button class="filter" data-role="医疗">医疗</button><button class="filter" data-role="重装">重装</button><button class="filter" data-role="辅助">辅助</button><button class="filter" data-role="特种">特种</button></div></div><div class="char-grid catalogue-grid" id="chars" aria-live="polite"></div><button id="more" class="button alt catalogue-more" hidden>加载更多档案</button></section></main><footer><div class="wrap footer">资料源：公开游戏资料表；角色、名称及立绘素材的相关权利归其权利人所有。本页面为非官方爱好者作品。</div></footer><div class="operator-modal" id="modal" aria-hidden="true"><div class="modal-backdrop" data-close="true"></div><section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-name"><button class="modal-close" id="close-modal" aria-label="关闭详情">×</button><div class="modal-art"><img id="modal-img" alt=""><div class="modal-art-fallback">RHODES ISLAND<br><b id="modal-id"></b></div></div><div class="modal-content"><div class="eyebrow">OPERATOR RECORD</div><div class="rarity" id="modal-rarity"></div><h2 id="modal-name"></h2><p class="modal-meta" id="modal-meta"></p><h3>干员档案</h3><p id="modal-desc"></p><div class="modal-actions"><a class="button" id="official-link" href="https://ak.hypergryph.com/" target="_blank" rel="noopener">前往官方资料入口 ↗</a><button class="button alt" id="close-modal-2">返回图鉴</button></div><p class="modal-note">详情字段来自公开游戏资料表；“官方资料入口”将打开《明日方舟》官方网站。</p></div></section></div><script>let operators=[],role='all',term='',limit=48;const box=document.querySelector('#chars'),more=document.querySelector('#more'),total=document.querySelector('#total'),shown=document.querySelector('#shown'),modal=document.querySelector('#modal');const stars=n=>'★'.repeat(n);function card(x){return `<article class="operator catalogue-operator" tabindex="0" role="button" aria-label="查看 ${x.name} 的干员档案" data-id="${x.id}"><img src="${x.portrait}" alt="${x.name}立绘" loading="lazy" onerror="this.closest('.operator').classList.add('image-missing')"><div class="archive-mark">RHODES ISLAND<br><b>${x.id.replace('char_','').toUpperCase()}</b></div><div class="info"><div class="rarity">${stars(x.rarity)}</div><h3>${x.name}</h3><small>${x.role} · ${x.position}<br>${x.desc}</small><span class="detail-hint">点击查看档案 ↗</span></div></article>`}function render(){const list=operators.filter(x=>(role==='all'||x.role===role)&&x.name.toLowerCase().includes(term.toLowerCase()));box.innerHTML=list.slice(0,limit).map(card).join('');shown.textContent=`显示 ${Math.min(limit,list.length)} / ${list.length} 名`;more.hidden=limit>=list.length;more.textContent=`加载更多档案（剩余 ${Math.max(0,list.length-limit)}）`}function openModal(id){const x=operators.find(a=>a.id===id);if(!x)return;document.querySelector('#modal-img').src=x.portrait;document.querySelector('#modal-img').alt=x.name+'立绘';document.querySelector('#modal-id').textContent=x.id.toUpperCase();document.querySelector('#modal-rarity').textContent=stars(x.rarity);document.querySelector('#modal-name').textContent=x.name;document.querySelector('#modal-meta').textContent=`${x.role} · ${x.position} · ${x.id}`;document.querySelector('#modal-desc').textContent=x.desc;document.querySelector('#official-link').href=x.official||'https://ak.hypergryph.com/';modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-open')}function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open')}box.addEventListener('click',e=>{const c=e.target.closest('[data-id]');if(c)openModal(c.dataset.id)});box.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.id){e.preventDefault();openModal(e.target.dataset.id)}});document.querySelector('#close-modal').onclick=closeModal;document.querySelector('#close-modal-2').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target.dataset.close)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.querySelector('#search').addEventListener('input',e=>{term=e.target.value.trim();limit=48;render()});document.querySelectorAll('#filters .filter').forEach(b=>b.onclick=()=>{role=b.dataset.role;limit=48;document.querySelectorAll('#filters .filter').forEach(a=>a.classList.toggle('active',a===b));render()});more.onclick=()=>{limit+=72;render()};fetch('assets/data/operators.json').then(r=>{if(!r.ok)throw Error('档案数据加载失败');return r.json()}).then(data=>{operators=data.operators;total.textContent=`已接入 ${data.count} 名干员档案`;render()}).catch(()=>{total.textContent='档案数据加载失败，请稍后刷新页面。'});</script></body></html>
