<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="明日方舟干员档案。"><title>干员档案｜罗德岛终端</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html">RHODES<i>•</i>ISLAND</a><nav class="navlinks"><a href="index.html">首页</a><a class="active" href="characters.html">干员档案</a><a href="game.html">塔防试玩</a></nav></div></header><main><section class="wrap"><div class="eyebrow">OPERATOR DATABASE</div><h1 class="section-title">干员档案</h1><p class="lead">以下为部分罗德岛干员。点击职业筛选以查看其战场定位；数据为展示用途，并非完整游戏资料。</p><div class="filterbar"><button class="filter active" data-role="all">全部</button><button class="filter" data-role="先锋">先锋</button><button class="filter" data-role="近卫">近卫</button><button class="filter" data-role="狙击">狙击</button><button class="filter" data-role="术师">术师</button><button class="filter" data-role="医疗">医疗</button><button class="filter" data-role="重装">重装</button></div><div class="char-grid" id="chars"></div></section></main><footer><div class="wrap footer">资料仅供爱好者浏览 · 角色及立绘素材版权归相应权利人所有</div></footer><script>const chars=[['阿米娅','术师','★★★★★','https://web.hycdn.cn/arknights/official/static/pc/assets/images/character/char_002_amiya.png','罗德岛公开领袖，以法术输出支援战场。'],['能天使','狙击','★★★★★★','https://web.hycdn.cn/arknights/official/static/pc/assets/images/character/char_103_angel.png','高射速对空狙击干员。'],['银灰','近卫','★★★★★★','https://web.hycdn.cn/arknights/official/static/pc/assets/images/character/char_172_svrash.png','喀兰贸易代表，擅长范围近战输出。'],['艾雅法拉','术师','★★★★★★','https://web.hycdn.cn/arknights/official/static/pc/assets/images/character/char_180_amgoat.png','以强大火山法术闻名的术师。'],['星熊','重装','★★★★★★','https://web.hycdn.cn/arknights/official/static/pc/assets/images/character/char_136_hsguma.png','龙门近卫局出身，防线的可靠屏障。'],['闪灵','医疗','★★★★★★','https://web.hycdn.cn/arknights/official/static/pc/assets/images/character/char_147_shining.png','能兼顾治疗与防护的医疗干员。'],['推进之王','先锋','★★★★★★','https://web.hycdn.cn/arknights/official/static/pc/assets/images/character/char_112_siege.png','部署初期提供费用与稳定近战能力。'],['陈','近卫','★★★★★★','https://web.hycdn.cn/arknights/official/static/pc/assets/images/character/char_010_chen.png','龙门近卫局特别督察组组长。'],['煌','近卫','★★★★★★','https://web.hycdn.cn/arknights/official/static/pc/assets/images/character/char_017_huang.png','拥有出色持续作战能力的近卫。'],['蓝毒','狙击','★★★★★','https://web.hycdn.cn/arknights/official/static/pc/assets/images/character/char_129_bluep.png','使用毒性攻击的速射手。'],['夜莺','医疗','★★★★★★','https://web.hycdn.cn/arknights/official/static/pc/assets/images/character/char_179_cgbird.png','偏重法术防护的医疗干员。'],['塞雷娅','重装','★★★★★★','https://web.hycdn.cn/arknights/official/static/pc/assets/images/character/char_202_demkni.png','莱茵生命成员，能治疗友军的重装。']];let role='all';const box=document.querySelector('#chars');function draw(){box.innerHTML=chars.filter(x=>role==='all'||x[1]===role).map(x=>`<article class="operator"><img src="${x[3]}" alt="${x[0]}官方立绘" loading="lazy" onerror="this.style.display='none'"><div class="info"><div class="rarity">${x[2]}</div><h3>${x[0]}</h3><small>${x[1]} · ${x[4]}</small></div></article>`).join('')}draw();document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('.filter').forEach(a=>a.classList.remove('active'));b.classList.add('active');draw()})</script></body></html>
